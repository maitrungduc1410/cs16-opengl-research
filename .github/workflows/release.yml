name: Release hack files

# Publishes the prebuilt hack (the `things-you-need-to-get-hack-works` folder) as a
# versioned GitHub Release so each published build and its download count are kept.
#
# Run this workflow manually from the Actions tab and enter a unique semantic version
# such as `v1.2.0`. The version is used as both the Git tag and release name.
#
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example: v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

# Queue release jobs instead of cancelling an earlier publication.
concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      ASSET: cs16-opengl-hack.zip
      SRC_DIR: things-you-need-to-get-hack-works
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be semantic, for example v1.2.0 or v1.2.0-beta.1"
            exit 1
          fi

      - name: Package hack files
        run: |
          cd "$SRC_DIR"
          zip -r "$GITHUB_WORKSPACE/$ASSET" .
          cd "$GITHUB_WORKSPACE"
          echo "Packaged:" && unzip -l "$ASSET"

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists. Enter a new version."
            exit 1
          fi

          cat > notes.md <<EOF
          Prebuilt hack files (\`opengl32.dll\` + \`oglconf.cfg\`) from the \`$SRC_DIR\` folder.

          - **Version:** \`$VERSION\`
          - **Built from commit:** \`${GITHUB_SHA:0:7}\`
          - **Published:** $(date -u '+%Y-%m-%d %H:%M UTC')

          **Direct download:** [\`$ASSET\`](https://github.com/${GITHUB_REPOSITORY}/releases/download/$VERSION/$ASSET)

          Unzip into your Counter-Strike 1.6 folder next to \`hl.exe\`. See the README for setup.
          EOF

          gh release create "$VERSION" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md